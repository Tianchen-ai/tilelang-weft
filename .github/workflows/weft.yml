name: Weft source and handbook
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff sphinx myst-parser furo
      - run: ruff check tilelang/weft examples/weft
      - run: python -m compileall -q tilelang/weft examples/weft
      - run: sphinx-build -W --keep-going -b html docs/weft public
      - uses: actions/upload-artifact@v4
        with:
          name: bilingual-handbook
          path: public
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bilingual-handbook
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
