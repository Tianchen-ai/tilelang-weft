<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790">
<title>TileLang and Triton share the Weft compiler</title>
<desc>Two native frontends enter one Canonical program, which retains field mappings, typed groups, prepared values and state updates. A shared compiler constructs x86 and RISC-V native kernels; a shared runtime invokes them from JIT and C/C++ callers.</desc>
<rect id="canvas" x="0" y="0" width="1400" height="790" fill="#FFFFFF"/>
<g font-family="Liberation Sans" fill="#25292D" stroke="none">
<path id="triton-frontend" d="M225 24 H585 Q595 24 595 34 V101 Q595 111 585 111 H225 Q215 111 215 101 V34 Q215 24 225 24 Z" fill="#FFFFFF" stroke="#68747C" stroke-width="1.8"/>
<text id="triton-title" x="405" y="62" text-anchor="middle" font-size="30" font-weight="bold">Triton</text>
<text id="triton-native" x="405" y="91" text-anchor="middle" font-size="22">native frontend</text>
<path id="tilelang-frontend" d="M815 24 H1175 Q1185 24 1185 34 V101 Q1185 111 1175 111 H815 Q805 111 805 101 V34 Q805 24 815 24 Z" fill="#FFFFFF" stroke="#68747C" stroke-width="1.8"/>
<text id="tilelang-title" x="995" y="62" text-anchor="middle" font-size="30" font-weight="bold">TileLang</text>
<text id="tilelang-native" x="995" y="91" text-anchor="middle" font-size="22">native frontend</text>

<path id="shared-compiler" d="M66 141 H1334 Q1350 141 1350 157 V585 Q1350 601 1334 601 H66 Q50 601 50 585 V157 Q50 141 66 141 Z" fill="#F5F7F8" stroke="#68747C" stroke-width="1.8"/>
