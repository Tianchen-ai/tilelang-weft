<path id="canonical-boundary" d="M94 196 H1306 Q1320 196 1320 210 V415 Q1320 429 1306 429 H94 Q80 429 80 415 V210 Q80 196 94 196 Z" fill="#FFFFFF" stroke="#2E7297" stroke-width="2"/>
<text id="canonical-title" x="700" y="233" text-anchor="middle" font-size="28" font-weight="bold">Weft Canonical IR</text>
<path id="triton-to-canonical" d="M405 111 V184" fill="none" stroke="#25292D" stroke-width="2"/>
<polygon id="triton-to-canonical-head" points="405,196 399,183 411,183" fill="#25292D"/>
<path id="tilelang-to-canonical" d="M995 111 V184" fill="none" stroke="#25292D" stroke-width="2"/>
<polygon id="tilelang-to-canonical-head" points="995,196 989,183 1001,183" fill="#25292D"/>

